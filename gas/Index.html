    function pseudoHash(str, seed) {
      let h = seed;
      for (let i = 0; i < str.length; i++) {
        h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
      }
      return Math.abs(h);
    }

    function generateQrSvg(text, size = 25) {
      const matrix = Array.from({ length: size }, () => Array(size).fill(false));
      const drawFinder = (startX, startY) => {
        for (let r = 0; r < 7; r++) {
          for (let c = 0; c < 7; c++) {
            if (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
              matrix[startY + r][startX + c] = true;
            } else {
              matrix[startY + r][startX + c] = false;
            }
          }
        }
      };
      drawFinder(0, 0);
      drawFinder(size - 7, 0);
      drawFinder(0, size - 7);

      for (let i = 8; i < size - 8; i++) {
        matrix[6][i] = i % 2 === 0;
        matrix[i][6] = i % 2 === 0;
      }

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const inTL = r < 8 && c < 8;
          const inTR = r < 8 && c >= size - 8;
          const inBL = r >= size - 8 && c < 8;
          const inTiming = (r === 6 && c >= 8 && c < size - 8) || (c === 6 && r >= 8 && r < size - 8);
          if (!inTL && !inTR && !inBL && !inTiming) {
            const h = pseudoHash(text + `:${r}:${c}`, (r * 33 + c * 7 + 101));
            matrix[r][c] = (h % 3) === 0 || ((r + c + h) % 2 === 0);
          }
        }
      }

      let rects = '';
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (matrix[r][c]) {
            rects += `<rect x="${c}" y="${r}" width="1" height="1" fill="#0f172a" />`;
          }
        }
      }
      return `<svg viewBox="0 0 ${size} ${size}" class="w-full h-full shape-rendering-crispEdges">${rects}</svg>`;
    }

    // Handler Aksi & Integrasi Google Apps Script
    function setLoginQuick(user, pass) {
      const uField = document.getElementById('login-username');
      const pField = document.getElementById('login-password');
      if (uField) uField.value = user;
      if (pField) pField.value = pass;
      const errBox = document.getElementById('login-error');
      if (errBox) errBox.classList.add('hidden');
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const user = document.getElementById('login-username').value.trim();
      const pass = document.getElementById('login-password').value.trim();

      // Jika dijalankan di dalam Google Apps Script (Web App terhubung)
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.success) {
              state.currentUser = res.user;
              render();
            } else {
              showLoginError(res.message || 'Username atau password tidak cocok.');
            }
          })
          .withFailureHandler(function(err) {
            showLoginError('Terjadi kendala koneksi ke database Google Sheets: ' + err);
          })
          .apiLogin(user, pass);
      } else {
        // Fallback Mandiri / Pratinjau Lokal
        if ((user === 'admin' && pass === 'admin123') || (user === 'guru' && pass === 'guru123') || (user === 'teknisi' && pass === 'teknisi123')) {
          state.currentUser = {
            id: 'usr-local',
            username: user,
            fullName: user === 'admin' ? 'Yana Maulana, S.Pd., M.Kom.' : (user === 'guru' ? 'Siti Rohmah, S.Pd.' : 'Agus Triono'),
            role: user === 'admin' ? 'admin_sarpras' : (user === 'guru' ? 'guru_peminjam' : 'teknisi')
          };
          render();
        } else {
          showLoginError('Username atau password yang Anda masukkan tidak sesuai.');
        }
      }
    }

    function showLoginError(msg) {
      const errBox = document.getElementById('login-error');
      if (errBox) {
        errBox.innerText = msg;
        errBox.classList.remove('hidden');
      }
    }

    function logout() {
      state.currentUser = null;
      render();
    }

    function openF4Modal(itemId) {
      state.selectedLabelItemId = itemId || (state.items[0] ? state.items[0].id : null);
      state.f4ModalOpen = true;
      render();
    }

    function switchSchool(schoolId) {
      const found = state.schools.find(s => s.id === schoolId);
      if (found) {
        state.activeSchool = found;
        render();
      }
    }

    function openAddSchoolModal() {
      state.addSchoolModalOpen = true;
      render();
    }

    function openAddItemModal() {
      state.addItemModalOpen = true;
      render();
    }

    function handleSaveSchoolSubmit(e) {
      e.preventDefault();
      const newSchool = {
        id: 'sch-' + Date.now(),
        name: document.getElementById('sch-name').value.trim(),
        npsn: document.getElementById('sch-npsn').value.trim(),
        level: document.getElementById('sch-level').value,
        status: 'Negeri',
        address: document.getElementById('sch-addr').value.trim(),
        city: document.getElementById('sch-city').value.trim() || 'Kota Pelajar',
        province: document.getElementById('sch-prov').value.trim() || 'Jawa Barat',
        principal: document.getElementById('sch-prin').value.trim() || 'Kepala Sekolah',
        sarprasHead: document.getElementById('sch-sarp').value.trim() || 'Koordinator Sarpras',
        academicYear: '2025/2026 Ganjil'
      };

      state.schools.push(newSchool);
      state.activeSchool = newSchool;
      state.addSchoolModalOpen = false;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.apiSaveSchool(newSchool);
      }
      render();
    }

    function handleSaveItemSubmit(e) {
      e.preventDefault();
      const newItem = {
        id: 'it-' + Date.now(),
        code: document.getElementById('it-code').value.trim(),
        name: document.getElementById('it-name').value.trim(),
        category: document.getElementById('it-cat').value,
        brand: document.getElementById('it-brand').value.trim(),
        specification: document.getElementById('it-spec').value.trim(),
        condition: 'Baik',
        status: 'Tersedia',
        locationName: document.getElementById('it-loc').value,
        acquisitionYear: Number(document.getElementById('it-year').value) || 2026,
        price: Number(document.getElementById('it-price').value) || 0,
        quantity: Number(document.getElementById('it-qty').value) || 1,
        unit: 'Unit'
      };

      state.items.unshift(newItem);
      state.addItemModalOpen = false;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.apiSaveItem(newItem);
      }
      render();
    }

    function deleteItem(itemId) {
      if (confirm('Yakin ingin menghapus data sarana ini?')) {
        state.items = state.items.filter(i => i.id !== itemId);
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.apiDeleteItem(itemId);
        }
        render();
      }
    }

    function returnLoan(loanId) {
      const loan = state.loans.find(l => l.id === loanId);
      if (loan) {
        loan.status = 'Dikembalikan';
        loan.actualReturnDate = new Date().toISOString().split('T')[0];
        const item = state.items.find(i => i.id === loan.itemId);
        if (item) item.status = 'Tersedia';

        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.apiReturnLoan(loanId, loan.actualReturnDate, 'Baik', 'Selesai');
        }
        render();
      }
    }

    // Sinkronisasi Data dengan Google Apps Script Saat Dimuat
    function syncWithGoogleAppsScript() {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(data) {
            if (data) {
              if (data.schools && data.schools.length > 0) state.schools = data.schools;
              if (data.activeSchool) state.activeSchool = data.activeSchool;
              if (data.items && data.items.length > 0) state.items = data.items;
              if (data.rooms && data.rooms.length > 0) state.rooms = data.rooms;
              if (data.loans && data.loans.length > 0) state.loans = data.loans;
              if (data.tickets && data.tickets.length > 0) state.tickets = data.tickets;
              render();
            }
          })
          .apiGetAllData();
      }
    }

    // Inisialisasi Aplikasi Saat Halaman Selesai Dimuat
    window.onload = function() {
      render();
      syncWithGoogleAppsScript();
    };
  </script>
