    // QR Code Matrix Generator (Zero External Dependencies)
    function pseudoHash(str, seed) {
      let h = seed;
      for (let i = 0; i < str.length; i++) {
        h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
      }
      return Math.abs(h);
    }

    function generateQrSvg(text, size = 25) {
      const matrix = Array.from({ length: size }, () => Array(size).fill(false));
      const drawFinder = (startX, startY) => {
        for (let r = 0; r < 7; r++) {
          for (let c = 0; c < 7; c++) {
            if (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
              matrix[startY + r][startX + c] = true;
            } else {
              matrix[startY + r][startX + c] = false;
            }
          }
        }
      };
      drawFinder(0, 0);
      drawFinder(size - 7, 0);
      drawFinder(0, size - 7);

      for (let i = 8; i < size - 8; i++) {
        matrix[6][i] = i % 2 === 0;
        matrix[i][6] = i % 2 === 0;
      }

      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const inTL = r < 8 && c < 8;
          const inTR = r < 8 && c >= size - 8;
          const inBL = r >= size - 8 && c < 8;
          const inTiming = (r === 6 && c >= 8 && c < size - 8) || (c === 6 && r >= 8 && r < size - 8);
          if (!inTL && !inTR && !inBL && !inTiming) {
            const h = pseudoHash(text + `:${r}:${c}`, (r * 33 + c * 7 + 101));
            matrix[r][c] = (h % 3) === 0 || ((r + c + h) % 2 === 0);
          }
        }
      }

      let rects = '';
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (matrix[r][c]) {
            rects += `<rect x="${c}" y="${r}" width="1" height="1" fill="#0f172a" />`;
          }
        }
      }
      return `<svg viewBox="0 0 ${size} ${size}" class="w-full h-full shape-rendering-crispEdges">${rects}</svg>`;
    }

              </div>
              <div class="flex items-center gap-2">
                <button onclick="window.print()" class="px-4 py-1.5 text-xs font-bold text-white bg-orange-600 hover:bg-orange-500 rounded-lg shadow-sm cursor-pointer">
                  Cetak Lembar F4
                </button>
                <button onclick="state.f4ModalOpen=false; render();" class="p-1.5 text-slate-400 hover:text-slate-700">✕</button>
              </div>
            </div>

            <div class="p-6 overflow-y-auto flex-1 bg-slate-100 print:bg-white print:p-0">
              <div class="mx-auto bg-white p-4 print:p-0 border border-slate-300 print:border-none shadow-md print:shadow-none" style="max-width: 800px;">
                <div class="grid grid-cols-2 gap-2.5 print:gap-2">
                  ${labels.map(it => `
                    <div class="f4-label-card border-2 border-slate-800 rounded-lg p-2.5 bg-white text-slate-900 flex flex-col justify-between" style="min-height: 185px;">
                      <div class="border-b-2 border-slate-800 pb-1 mb-1.5 text-center">
                        <div class="text-[8px] font-bold uppercase text-slate-600">PEMERINTAH DAERAH · DINAS PENDIDIKAN</div>
                        <div class="text-[11px] font-bold text-blue-950">${state.activeSchool.name.toUpperCase()}</div>
                        <div class="text-[8px] font-mono text-slate-500">LABEL INVENTARIS · NPSN: ${state.activeSchool.npsn}</div>
                      </div>

                      <div class="flex items-start gap-2.5">
                        <div class="w-20 h-20 shrink-0 border border-slate-300 p-1 flex flex-col items-center justify-center">
                          ${generateQrSvg(it.code, 25)}
                          <span class="text-[7px] font-mono font-bold text-slate-600 mt-0.5">SCAN QR</span>
                        </div>
                        <div class="flex-1 min-w-0">
                          <span class="inline-block bg-slate-100 text-slate-900 font-mono font-bold text-[11px] px-1.5 py-0.5 rounded border border-slate-300">${it.code}</span>
                          <h4 class="text-xs font-bold text-slate-900 mt-1 line-clamp-2">${it.name}</h4>
                          <div class="mt-1 text-[9px] text-slate-600 space-y-0.5">
                            <div>Merk: <strong>${it.brand || '-'}</strong></div>
                            <div>Ruang: <strong>${it.locationName || '-'}</strong></div>
                            <div>Kondisi: <strong class="text-emerald-700">${it.condition}</strong></div>
                          </div>
                        </div>
                      </div>

                      <div class="mt-1.5 pt-1 border-t border-slate-200 text-center font-mono text-[8px] text-slate-600">
                        *${it.code}*
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // Handlers
    function handleLoginSubmit(e) {
      e.preventDefault();
      const user = document.getElementById('login-username').value.trim();
      const pass = document.getElementById('login-password').value.trim();

      // Check against server via google.script.run if present, or fallback
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.success) {
              state.currentUser = res.user;
              render();
            } else {
              showLoginError(res.message || 'Username atau password salah.');
            }
          })
          .apiLogin(user, pass);
      } else {
        // Standalone / Offline check
        if ((user === 'admin' && pass === 'admin123') || (user === 'guru' && pass === 'guru123') || (user === 'teknisi' && pass === 'teknisi123')) {
          state.currentUser = { username: user, fullName: user === 'admin' ? 'Yana Maulana (Admin)' : 'Pengguna Sekolah' };
          render();
        } else {
          showLoginError('Username atau password yang Anda masukkan salah.');
        }
      }
    }

    function showLoginError(msg) {
      const errBox = document.getElementById('login-error');
      if (errBox) {
        errBox.innerText = msg;
        errBox.classList.remove('hidden');
      }
    }

    function logout() {
      state.currentUser = null;
      render();
    }

    function openF4Modal(itemId) {
      if (itemId) {
        state.selectedLabelItem = state.items.find(i => i.id === itemId);
      } else {
        state.selectedLabelItem = state.items[0];
      }
      state.f4ModalOpen = true;
      render();
    }

    function switchSchool(schoolId) {
      const found = state.schools.find(s => s.id === schoolId);
      if (found) {
        state.activeSchool = found;
        render();
      }
    }

    function openAddSchoolModal() {
      const newName = prompt('Masukkan Nama Sekolah Baru:');
      if (newName && newName.trim()) {
        const newNpsn = prompt('Masukkan NPSN Sekolah:', '2021' + Math.floor(1000 + Math.random() * 9000));
        const newSchool = {
          id: 'sch-' + Date.now(),
          name: newName.trim(),
          npsn: (newNpsn || '20210000').trim(),
          level: 'SMP',
          status: 'Negeri',
          city: 'Kota Pelajar',
          province: 'Jawa Barat',
          principal: 'Kepala Sekolah Baru',
          sarprasHead: 'Koordinator Sarpras',
          academicYear: '2025/2026 Ganjil'
        };
        state.schools.push(newSchool);
        state.activeSchool = newSchool;
        
        // Simpan ke Google Sheet jika ada backend
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.apiSaveSchool(newSchool);
        }
        render();
      }
    }

    // Inisialisasi Aplikasi Saat Halaman Selesai Dimuat
    window.onload = function() {
      render();
      syncWithGoogleAppsScript();
    };
  </script>
</body>
</html>
